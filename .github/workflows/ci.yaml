name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4.3.1

      - name: Lint library chart
        run: helm lint charts/casc-bundle-lib

      - name: Package library chart into example chart dependency directory
        run: |
          mkdir -p examples/chart/casc-bundle/charts
          helm package charts/casc-bundle-lib -d examples/chart/casc-bundle/charts/

      - name: Lint example chart
        run: |
          helm lint examples/chart/casc-bundle -f examples/chart/values-oc.yaml
          helm lint examples/chart/casc-bundle -f examples/chart/values-mc.yaml

      - name: Run unit tests
        run: |
          docker run --rm -v $(pwd):/apps helmunittest/helm-unittest:4.3.0-1.2.0 \
            --output-type junit \
            --output-file /apps/junit.xml \
            --strict \
            --file 'tests/*.yaml' \
            examples/chart/casc-bundle

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-test-results
          path: junit.xml
