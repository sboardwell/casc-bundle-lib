name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint library chart
        run: helm lint charts/casc-bundle-lib

      - name: Package library chart into example chart dependency directory
        run: |
          mkdir -p examples/chart/casc-bundle/charts
          helm package charts/casc-bundle-lib -d examples/chart/casc-bundle/charts/

      - name: Lint example chart
        run: |
          helm lint examples/chart/casc-bundle -f examples/chart/values-oc.yaml
          helm lint examples/chart/casc-bundle -f examples/chart/values-mc.yaml

      - name: Run unit tests
        run: |
          docker run --rm -v $(pwd):/apps helmunittest/helm-unittest:3.11.1-0.3.0 \
            --output-type junit \
            --output-file junit.xml \
            --strict \
            --file 'tests/*.yaml' \
            examples/chart/casc-bundle

      - name: Publish test results
        uses: mikepenz/action-junit-report@v3
        if: always()
        with:
          report_paths: junit.xml
