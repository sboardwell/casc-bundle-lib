name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.0
      - run: gh actions-lock --verify

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4.3.1

      - name: Lint library chart
        run: helm lint charts/casc-bundle-lib

      - name: Sync library into test-consumer charts/ directory
        run: |
          mkdir -p charts/casc-bundle-lib-test-consumer/charts
          cp -r charts/casc-bundle-lib charts/casc-bundle-lib-test-consumer/charts/casc-bundle-lib

      - name: Run unit tests
        run: |
          docker run --rm \
            -v $(pwd):/apps \
            --mount type=tmpfs,destination=/.cache \
            --user $(id -u):$(id -g) \
            helmunittest/helm-unittest:4.3.0-1.2.0 \
            --output-type junit \
            --output-file /apps/junit.xml \
            --strict \
            --file 'tests/*.yaml' \
            charts/casc-bundle-lib-test-consumer

      - name: Lint example chart
        run: |
          mkdir -p examples/casc-bundle/charts
          helm package charts/casc-bundle-lib -d examples/casc-bundle/charts/
          helm lint examples/casc-bundle -f examples/services/oc/values.yaml
          helm lint examples/casc-bundle -f examples/services/mc/values.yaml

      - name: Publish test results
        uses: mikepenz/action-junit-report@v6.6.1
        if: always()
        with:
          report_paths: '**/junit.xml'
