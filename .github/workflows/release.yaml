name: Release chart

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  CHART_PATH: charts/casc-bundle-lib

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4.3.1

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Extract version from release tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: helm package ${{ env.CHART_PATH }} --version ${{ steps.version.outputs.version }}

      - name: Push chart to GHCR
        run: |
          helm push casc-bundle-lib-${{ steps.version.outputs.version }}.tgz \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
