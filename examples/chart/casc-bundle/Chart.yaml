apiVersion: v2
name: casc-bundle
description: CloudBees CI CasC bundle — consumer chart example
type: application
version: 0.1.0
dependencies:
  - name: casc-bundle-lib
    version: "0.1.0"
    # Once published, real consumers resolve this with: helm dependency update
    # During local development (pre-publish), use: make examples/deps
    # That packages the local library and drops the tarball into charts/, which
    # Helm uses directly without contacting the OCI registry.
    repository: "oci://ghcr.io/sboardwell/charts"
